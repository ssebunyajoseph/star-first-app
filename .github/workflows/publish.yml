name: Publish Star first App

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v1
        with:
          path: ./

      - uses: actions/deploy-pages@v1
